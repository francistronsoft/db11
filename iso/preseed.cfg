#_preseed_V1
# Disco, particionamento e senhas continuam sob confirmacao do tecnico.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i clock-setup/ntp boolean false
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string openssh-server sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i preseed/late_command string mkdir -p /target/opt/db11-kit /target/usr/local/sbin; cp -a /cdrom/tronsoftos/kit/. /target/opt/db11-kit/; cp /cdrom/tronsoftos/instalar /target/usr/local/sbin/instalar; chmod 755 /target/usr/local/sbin/instalar; cp /cdrom/tronsoftos/INSTALAR.txt /target/root/INSTALAR-TRONSOFTOS.txt
